version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - bodyclose
    - noctx
    - misspell
  settings:
    errcheck:
      # What novaro prints to the terminal: a failed write there has nowhere
      # else to go.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
